apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: practica-creativa
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.practica-creativa.svc.cluster.local:9090
        isDefault: true