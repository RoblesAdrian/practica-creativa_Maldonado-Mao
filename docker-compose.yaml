services:

  cassandra:
    image: cassandra:4.1
    container_name: cassandra
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  cassandra-init:
    image: cassandra:4.1
    container_name: cassandra-init
    depends_on:
      - cassandra
    volumes:
      - ./cassandra-init:/scripts:ro
      - ./data:/seed-data:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    environment:
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: "9042"

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_REGION: eu-south-2
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mc-init:
    image: minio/mc
    container_name: mc-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set minio http://minio:9000 admin password); do
        echo 'waiting for minio...';
        sleep 1;
      done;
      mc mb --ignore-existing minio/warehouse;
      exit 0;
      "

  iceberg-rest:
    image: apache/iceberg-rest-fixture
    container_name: iceberg-rest
    depends_on:
      - minio
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: eu-south-2
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"

  spark-master:
    build:
      context: ./docker/spark-submit
      dockerfile: Dockerfile
    image: spark-lakehouse-runtime:4.1.2
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
    ports:
      - "8080:8080"
      - "7077:7077"

  spark-worker-1:
    image: spark-lakehouse-runtime:4.1.2
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8081:8081"

  spark-worker-2:
    image: spark-lakehouse-runtime:4.1.2
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "8082:8081"

  spark-submit-load-train-data:
    image: spark-lakehouse-runtime:4.1.2
    container_name: spark-submit-load-train-data
    depends_on:
      - spark-master
      - minio
      - iceberg-rest
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      PYSPARK_PYTHON: python3
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: eu-south-2
      AWS_DEFAULT_REGION: eu-south-2
      HOME: /tmp
    command:
      - /bin/bash
      - -lc
      - >
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        /workspace/resources/load_lakehouse_assets.py

  spark-submit-train:
    image:  spark-lakehouse-runtime:4.1.2
    container_name: spark-submit-train
    depends_on:
      spark-master:
        condition: service_started
      minio:
        condition: service_started
      iceberg-rest:
        condition: service_started
      spark-submit-load-train-data:
        condition: service_completed_successfully
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      PYSPARK_PYTHON: python3
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: eu-south-2
      AWS_DEFAULT_REGION: eu-south-2
      HOME: /tmp
    command:
      - /bin/bash
      - -lc
      - >
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        /workspace/resources/train_model_lakehouse_simple.py

  spark-submit-predict:
    image: spark-lakehouse-runtime:4.1.2
    container_name: spark-submit-predict
    depends_on:
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      spark-submit-train:
        condition: service_completed_successfully
      cassandra:
        condition: service_started
      cassandra-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
      iceberg-rest:
        condition: service_started
    volumes:
      - ./:/workspace
    working_dir: /workspace
    environment:
      PYSPARK_PYTHON: python3
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: eu-south-2
      AWS_DEFAULT_REGION: eu-south-2
      HOME: /tmp
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REQUEST_TOPIC: flight-delay-ml-request
      RESPONSE_TOPIC: flight-delay-ml-response
      MODEL_PATH: s3a://warehouse/artifacts/models/rfc_flight_delays
      SPARK_HOME: /opt/spark
    command:
      - /bin/bash
      - -lc
      - >
        /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --deploy-mode client
        --conf spark.jars.ivy=/tmp/.ivy2
        --conf spark.local.dir=/tmp/spark-local
        --conf spark.cores.max=2
        --conf spark.executor.cores=1
        --class es.upm.dit.ging.predictor.MakePrediction
        --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2
        /workspace/flight_prediction/target/scala-2.13/flight_prediction-assembly-0.1.jar

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  kafka-init:
    image: apache/kafka:4.2.0
    container_name: kafka-init
    depends_on:
      - kafka
    command: >
      bash -lc '
      until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
        echo "waiting for kafka...";
        sleep 2;
      done &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create
      --if-not-exists
      --topic flight-delay-ml-request
      --partitions 1
      --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create
      --if-not-exists
      --topic flight-delay-ml-response
      --partitions 1
      --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      '

  web:
    build:
      context: .
      dockerfile: ./resources/web/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PROJECT_HOME=/app
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      cassandra-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    image: python:3.11-slim
    container_name: mlflow
    depends_on:
      minio:
        condition: service_started
    ports:
      - "5001:5000"
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: eu-south-2
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      bash -lc "
      pip install --no-cache-dir mlflow boto3 psycopg2-binary &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root s3://warehouse/mlflow-artifacts
      --disable-security-middleware
      "

  airflow-init:
    image: airflow-lakehouse:2.10.4
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "eNW7wcd3cd3InwCIcsqO_kKo29XidorRZLGmYDdJ9I4="
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/workspace
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create
        --username admin
        --password 'admin'
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true
      "

  airflow-webserver:
    build:
      context: ./docker/airflow
      dockerfile: Dockerfile
    image: airflow-lakehouse:2.10.4
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "eNW7wcd3cd3InwCIcsqO_kKo29XidorRZLGmYDdJ9I4="
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: eu-south-2
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/workspace
      - ./docker/airflow/start-airflow-webserver.sh:/opt/airflow/start-airflow-webserver.sh
    command: >
      bash -lc "
      airflow db migrate &&
      airflow webserver
      "

  airflow-scheduler:
    image: airflow-lakehouse:2.10.4
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      airflow-webserver:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "eNW7wcd3cd3InwCIcsqO_kKo29XidorRZLGmYDdJ9I4="
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: eu-south-2
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./:/workspace
    command: >
      bash -lc "exec airflow scheduler"


  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - node-exporter
      - cadvisor

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  mongo_data:
  cassandra_data:
  minio_data:
  kafka_data:
  airflow_postgres_data:
  prometheus_data:
  grafana_data: